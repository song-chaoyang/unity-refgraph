[package]
name = "unity-refgraph"
version = "0.1.0"
edition = "2021"
description = "Standalone Unity project asset relationship and reference analyzer"

[[bin]]
name = "unity-refgraph"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
clap = { version = "4.6", features = ["derive"] }
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
rayon = "1.12"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
glob = "0.3"
regex = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }
indicatif = "0.17"
rust-embed = { version = "8.0", features = ["axum"] }
mime_guess = "2.0"
once_cell = "1.19"
anyhow = "1.0"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.0"
